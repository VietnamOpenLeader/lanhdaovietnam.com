name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run type, unit, API, CLI, i18n, content, and production build gates
        run: bun run check
      - name: Install Chromium for browser E2E
        run: bunx playwright install --with-deps chromium
      - name: Run desktop and mobile browser E2E
        run: bun run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: .void/test-projects/**/test-results/
          if-no-files-found: ignore
